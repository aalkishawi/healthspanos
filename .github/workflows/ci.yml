name: CI

# Every PR must be green before merge. `main` runs the same gate so a bad
# merge is caught even if a PR was merged out of date.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real Postgres so `prisma migrate deploy` is exercised for real. Without
    # it CI would prove the app compiles but not that the committed migrations
    # actually apply — which is the failure that takes production down.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healthspan_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/healthspan_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/healthspan_ci?schema=public
      # Test-only value. Real secrets live in the Vercel project, never here.
      AUTH_SECRET: ci-only-secret-not-used-in-any-real-environment-000000000000
      NEXT_PUBLIC_DEFAULT_LOCALE: en

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Proves the committed migration history applies cleanly to an empty
      # database — the same command production runs.
      - name: Apply migrations
        run: npx prisma migrate deploy

      # Fails if schema.prisma has drifted from prisma/migrations, i.e. someone
      # edited the schema without generating a migration.
      - name: Check for schema drift
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code
        continue-on-error: false

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
